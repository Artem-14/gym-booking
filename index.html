<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Запись на тренировку</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --sec: var(--tg-theme-secondary-bg-color, #f1f1f4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px 16px 90px; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 18px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 0; border-radius: 12px; padding: 10px 14px; background: var(--sec); color: var(--text);
          font: inherit; cursor: pointer; }
  .chip.sel { background: var(--btn); color: var(--btn-text); }
  .chip small { display: block; font-size: 12px; opacity: .75; }
  textarea { width: 100%; min-height: 80px; border: 0; border-radius: 12px; padding: 12px; resize: none;
             background: var(--sec); color: var(--text); font: inherit; }
  .msg { color: var(--hint); padding: 24px 0; text-align: center; }
  .btn { display: none; width: 100%; margin-top: 18px; border: 0; border-radius: 12px; padding: 14px;
         background: var(--btn); color: var(--btn-text); font: inherit; font-weight: 600; }
</style>
</head>
<body>
<h1>📅 Запись на тренировку</h1>
<div id="app"><div class="msg">Загрузка расписания…</div></div>

<script>
/* ВСТАВЬТЕ СЮДА URL РАЗВЁРТЫВАНИЯ GOOGLE APPS SCRIPT (заканчивается на /exec) */
const API = 'https://script.google.com/macros/s/AKfycbws1g6JzvEz10AWq8iDEbgNpcabJ4olE9yYFDZT1WzC8z2OLSus4b56HHhDGMeSBqE8/exec';

const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let slots = [], selDate = null, selSlot = null, busy = false;
const $app = document.getElementById('app');
const DOW = ['вс','пн','вт','ср','чт','пт','сб'];

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function fmtDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return { top: String(d).padStart(2,'0') + '.' + String(m).padStart(2,'0'), sub: DOW[dt.getDay()] };
}

async function load() {
  try {
    const r = await fetch(API + '?action=schedule');
    const d = await r.json();
    slots = d.slots || [];
    if (selSlot && !slots.find(s => s.id === selSlot.id)) selSlot = null;
    render();
  } catch (e) {
    $app.replaceChildren(el('div', 'msg', 'Не удалось загрузить расписание. Потяните вниз и откройте заново.'));
  }
}

function render() {
  const keepComment = document.getElementById('comment') ? document.getElementById('comment').value : '';
  $app.replaceChildren();
  if (!slots.length) { $app.append(el('div', 'msg', 'Свободных слотов пока нет.')); updateBtn(); return; }

  const dates = [...new Set(slots.map(s => s.date))];
  if (!selDate || !dates.includes(selDate)) selDate = dates[0];

  $app.append(el('h2', '', 'Дата'));
  const dRow = el('div', 'row');
  dates.forEach(d => {
    const f = fmtDay(d);
    const b = el('button', 'chip' + (d === selDate ? ' sel' : ''), f.top);
    b.append(el('small', '', f.sub));
    b.onclick = () => { selDate = d; selSlot = null; render(); };
    dRow.append(b);
  });
  $app.append(dRow);

  $app.append(el('h2', '', 'Время'));
  const tRow = el('div', 'row');
  slots.filter(s => s.date === selDate).forEach(s => {
    const b = el('button', 'chip' + (selSlot && selSlot.id === s.id ? ' sel' : ''), s.time);
    b.append(el('small', '', s.title + ' · ' + s.price + ' ₽'));
    b.onclick = () => { selSlot = s; render(); };
    tRow.append(b);
  });
  $app.append(tRow);

  $app.append(el('h2', '', 'Комментарий'));
  const ta = el('textarea');
  ta.id = 'comment'; ta.maxLength = 300; ta.placeholder = 'Пожелания тренеру (необязательно)';
  ta.value = keepComment;
  $app.append(ta);
  updateBtn();
}

function updateBtn() {
  if (selSlot) {
    tg.MainButton.setText('Оформить · ' + selSlot.price + ' ₽');
    tg.MainButton.show();
  } else tg.MainButton.hide();
}

async function submit() {
  if (busy || !selSlot) return;
  if (!tg.initData) { tg.showAlert('Откройте приложение через Telegram-бота.'); return; }
  busy = true; 
  
  const commentText = (document.getElementById('comment') || {}).value || '';

  // 1) Сначала отправляем запрос скрипту со ВСЕМИ данными авторизации Telegram
  try {
    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'book',
        initData: tg.initData,
        slotId: selSlot.id,
        comment: commentText
      })
    });
  } catch (e) {
    console.error('Ошибка фоновой отправки брони', e);
  }

  // 2) Даем браузеру телефона 150 миллисекунд, чтобы пакет железно улетел в сеть, и только потом закрываем Web App
  setTimeout(() => {
    busy = false;
    tg.close();
  }, 150);
}


tg.MainButton.onClick(submit);
load();
</script>
</body>
</html>
